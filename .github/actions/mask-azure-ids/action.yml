name: Check and mask Azure IDs
description: >-
  Masks, then validates, the Azure client, tenant and subscription IDs that the caller provides
  as the environment variables ARM_CLIENT_ID, ARM_TENANT_ID and ARM_SUBSCRIPTION_ID. The log
  stays clean only because those values come from secrets, which the runner masks from the first
  log line: every environment variable or input that carries them, here and in any caller, must
  be fed from secrets.* and never from vars.* or a literal, because a variable or literal would
  print unmasked in a public log, including in the header of the step that sets it. Fails naming
  the variable if one is empty or not a GUID; never prints a value.

runs:
  using: composite
  steps:
    - name: Check and mask Azure IDs
      shell: bash
      run: |
        # Mask every value first, so one that fails the check below is still masked. Masking is
        # case-sensitive and Azure prints IDs in lowercase, so mask the lower and upper case
        # forms as well as the value as stored. Never echo a value: report only which one is wrong.
        failed=0
        for name in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
          if [ -n "${!name}" ]; then
            echo "::add-mask::${!name}"
            echo "::add-mask::${!name,,}"
            echo "::add-mask::${!name^^}"
          fi
        done
        for name in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
          if [ -z "${!name}" ]; then
            echo "::error::${name} is empty: the matching Actions secret (Dependabot secret for Dependabot runs) is not set"
            failed=1
          elif ! [[ "${!name}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::${name} is not a GUID (check the secret for whitespace)"
            failed=1
          fi
        done
        exit "${failed}"
