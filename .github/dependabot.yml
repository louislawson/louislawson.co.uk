version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @astrojs/check does not support TypeScript 7 yet. Remove this rule once it does.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Pinned to the head of the action's maintained `v1` branch, because its `v1` tag still
      # points at a 2021 commit without the inputs this site uses. Dependabot would propose
      # moving back to that tag. Bump by hand after reading the changes.
      - dependency-name: Azure/static-web-apps-deploy
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: terraform
    # Keep every Terraform stack in this one entry: group-by only takes effect across several
    # directories, so do not add a second terraform entry.
    directories:
      - /infra/bootstrap
      - /infra/site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-patch:
        group-by: dependency-name
        update-types:
          - minor
          - patch
