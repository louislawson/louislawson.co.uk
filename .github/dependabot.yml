version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @astrojs/check does not support TypeScript 7 yet. Remove this rule once it does.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # The majors of @types/node follow the Node version in .nvmrc, the runtime the site builds
      # and deploys with: not the latest Node, and not the lower bound in "engines". Types for a
      # newer major would describe APIs the runtime does not have. Bump them by hand, together
      # with .nvmrc.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    # The local composite actions pin third-party actions of their own (azure/login), which a
    # scan of / alone would never reach.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    # Microsoft's Static Web Apps client image, pinned by digest in the local swa-client action.
    # Its only tags are latest, prev and stable, so Dependabot proposes new digests of `stable`.
    # Dependabot pull requests get no preview, so a new digest is first exercised by the
    # production deploy after merge; a failure there leaves the last good build live.
    directory: /.github/actions/swa-client
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: terraform
    # Keep every Terraform stack in this one entry: group-by only takes effect across several
    # directories, so do not add a second terraform entry.
    directories:
      - /infra/bootstrap
      - /infra/site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-patch:
        group-by: dependency-name
        update-types:
          - minor
          - patch
