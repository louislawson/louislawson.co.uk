version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @astrojs/check does not support TypeScript 7 yet. Remove this rule once it does.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # The majors of @types/node follow the Node version in .nvmrc, not the latest Node: types for
      # a newer major would describe APIs the runtime does not have. Bump them by hand, together
      # with .nvmrc and engines.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # MANUALLY TRACKED: see "Manually tracked" in the README.
      # The action is pinned to the head of its maintained `v1` branch, because its `v1` tag still
      # points at a 2021 commit without the inputs this site uses, and Dependabot would propose
      # moving back to that tag. The ignore is needed for that reason, but it also stops
      # Dependabot proposing security updates for this action. It is the one third-party component
      # that handles the deployment token and runs with the job's OIDC request token, so watch
      # its advisories and its `v1` branch yourself, and bump it by hand after reading the changes.
      - dependency-name: Azure/static-web-apps-deploy
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: terraform
    # Keep every Terraform stack in this one entry: group-by only takes effect across several
    # directories, so do not add a second terraform entry.
    directories:
      - /infra/bootstrap
      - /infra/site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-patch:
        group-by: dependency-name
        update-types:
          - minor
          - patch
