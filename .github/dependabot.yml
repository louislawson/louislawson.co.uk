version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @astrojs/check does not support TypeScript 7 yet. Remove this rule once it does.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-patch:
        group-by: dependency-name
        update-types:
          - minor
          - patch
