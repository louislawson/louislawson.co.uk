name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check

  check:
    name: Astro check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  # Builds the site for both deploy contexts and runs the Playwright tests against them, served by
  # e2e/serve.ts with the build's own staticwebapp.config.json (the CSP and the other headers). The
  # HTML report is kept only when a test fails. Louis adds this job's name to the required checks
  # after its first run.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # npx runs the Playwright in package-lock.json, so the browsers match the tests' version.
      # The browsers' system packages come from Ubuntu's mirror, which once held this job for its
      # whole 20 minutes. Each attempt is cut off after 5 minutes, and a failed or cut-off one runs
      # once more. timeout runs as root so that its signal reaches apt-get and its downloads: run as
      # the runner user it stopped only npx, apt-get kept the dpkg lock, and the retry failed on it.
      # dpkg --configure -a finishes an install that was cut off while unpacking. Short network
      # timeouts make apt give up on a stalled mirror connection quickly instead of waiting on it
      # (actions/runner-images#14594, a degraded azure.archive.ubuntu.com).
      - name: Install the browsers' system packages
        timeout-minutes: 12
        run: |
          printf 'Acquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "3";\n' |
            sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null
          for attempt in 1 2; do
            if sudo env "PATH=${PATH}" timeout --kill-after=30s 5m npx playwright install-deps chromium webkit; then
              exit 0
            fi
            echo "::warning::System package install attempt ${attempt} failed or took over 5 minutes"
            if ! sudo dpkg --configure -a; then
              echo "::warning::dpkg --configure -a failed after attempt ${attempt}"
            fi
          done
          exit 1
      - name: Install the browsers
        timeout-minutes: 5
        run: npx playwright install chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Validates the HTML of both builds and checks their internal links, #fragment anchors and assets
  # offline: html-validate, then lychee once per build, because a build's absolute links
  # (/projects/..., /_astro/...) resolve against its own folder. External links are not checked
  # here; links.yml reports them weekly. Louis adds this job's name to the required checks after
  # its first run.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:e2e
      - run: npm run validate:html
      # lychee reads lychee.toml. $GITHUB_WORKSPACE is expanded by the action's own shell, so each
      # --root-dir is an absolute path. The lychee version is set here, not left to the action's
      # default, and is bumped by hand (Dependabot does not track it).
      - name: Check the preview build's links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --offline --include-fragments
            --root-dir "$GITHUB_WORKSPACE/dist-e2e/preview"
            'dist-e2e/preview/**/*.html'
      - name: Check the production build's links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --offline --include-fragments
            --root-dir "$GITHUB_WORKSPACE/dist-e2e/production"
            'dist-e2e/production/**/*.html'

  # A warning, not a gate: one annotation with the count and the full list in the job summary
  # (GitHub shows at most 10 annotations per step). The script reads only the repository, so
  # nothing is installed. The launch gate in the build is what blocks production.
  placeholders:
    name: Placeholders
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm run placeholders -- --github

  # Fails if any tracked image or PDF carries personal metadata (EXIF, XMP, IPTC, an author, a
  # file path). It checks every file `git ls-files` lists, so no folder is excluded. Add this
  # job's name to the "Protect main" required checks after its first run.
  metadata:
    name: Metadata check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run metadata:check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Not tracked by Dependabot: bump by hand.
          version: 1.30.1
          advanced-security: false
          annotations: true

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Not tracked by Dependabot: bump both by hand (checksum is in the release's checksums.txt).
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
      - name: Lint workflows
        run: '"${RUNNER_TEMP}/actionlint" -color'
