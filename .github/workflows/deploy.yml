name: Deploy

on:
  push:
    branches: [main]
    paths: &site_paths
      - "**"
      - "!docs/**"
      - "!infra/**"
      - "!.github/**"
      - .github/workflows/deploy.yml
      - .github/actions/mask-azure-ids/**
      - "!**/*.md"
      - src/**/*.md
  # `closed` removes the preview. Pull requests that change none of the site paths (docs-only,
  # infrastructure-only, workflow-only) get no preview, but still build and test in CI.
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: *site_paths

permissions: {}

# Nothing is cancelled mid-deploy. Each pull request has its own group; production has one, so
# two pushes to main deploy in order.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

env:
  # Not secrets: both names are committed in infra/site.
  SWA_NAME: stapp-louislawson-web-prod-weu
  SWA_RESOURCE_GROUP: rg-louislawson-web-prod-weu

jobs:
  build:
    # Not just "Build": the CI workflow has a required check with that name.
    name: Deploy build
    # Previews are skipped for Dependabot pull requests and for forks (neither can reach the
    # plan identity), and the free plan allows only 3 preview environments at once.
    if: >-
      github.event.action != 'closed'
      && (github.event_name == 'push'
        || (github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # SITE_URL is plain configuration: set the SITE_URL repository variable when the
          # domain is connected. Unset, the site falls back to its default in src/config/site.ts.
          SITE_URL: ${{ vars.SITE_URL }}
          # Preview builds always send noindex: preview URLs are public.
          DEPLOY_CONTEXT: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          GIT_SHA="${GITHUB_SHA::7}" npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `environment:` here: that would change the OIDC subject, and the plan identity is
    # trusted only for pull_request and ref:refs/heads/main. No `npm install` either: this job
    # holds the identity, so it downloads the build artifact and runs nothing from the project.
    permissions:
      contents: read # sparse checkout of the local actions only
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    outputs:
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    steps:
      # A local action needs the repository, but only the actions folder: this job holds the
      # identity, so it checks out nothing else. `$/` would avoid the checkout, but actionlint
      # 1.7.12 rejects it; switch when a release accepts it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - name: Check and mask Azure IDs
        uses: ./.github/actions/mask-azure-ids # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the `$/` syntax
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # The deployment token is fetched at run time and masked. It is never a GitHub secret and
      # never printed. Do not set TF_LOG or enable debug logging here: debug output can include
      # the listSecrets response, which carries the token.
      - name: Fetch the deployment token
        id: token
        run: |
          token="$(az staticwebapp secrets list --name "${SWA_NAME}" --resource-group "${SWA_RESOURCE_GROUP}" \
            --query properties.apiKey --output tsv)"
          if [ -z "${token}" ]; then
            echo "::error::Could not read the deployment token for ${SWA_NAME}"
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"
      # Pinned to the head of the action's maintained `v1` branch (see .github/dependabot.yml).
      # It builds a container from a floating Microsoft image at run time, so treat it as the
      # one third-party component that handles the token.
      - name: Upload to Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1 branch, 2024-09-11
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          production_branch: main

  comment:
    name: Preview comment
    needs: deploy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # edits the sticky preview comment; no checkout, no Azure access
    steps:
      - name: Post the preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ needs.deploy.outputs.url }}
        run: |
          marker='<!-- deploy-preview -->'
          {
            echo "${marker}"
            echo "### Preview"
            echo
            echo "${PREVIEW_URL} (built from ${HEAD_SHA:0:7})"
            echo
            echo "Public, marked noindex, and removed when this pull request closes."
          } > comment.md
          id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- deploy-preview -->"))) | .id' | head -n 1)"
          if [ -n "${id}" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${id}" --field body=@comment.md > /dev/null
          else
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file comment.md
          fi

  close_pull_request:
    name: Remove preview
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # sparse checkout of the local actions only
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      # A local action needs the repository, but only the actions folder: this job holds the
      # identity, so it checks out nothing else. `$/` would avoid the checkout, but actionlint
      # 1.7.12 rejects it; switch when a release accepts it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - name: Check and mask Azure IDs
        uses: ./.github/actions/mask-azure-ids # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the `$/` syntax
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Fetch the deployment token
        id: token
        run: |
          token="$(az staticwebapp secrets list --name "${SWA_NAME}" --resource-group "${SWA_RESOURCE_GROUP}" \
            --query properties.apiKey --output tsv)"
          if [ -z "${token}" ]; then
            echo "::error::Could not read the deployment token for ${SWA_NAME}"
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"
      - name: Close the preview environment
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1 branch, 2024-09-11
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: close
          app_location: dist
