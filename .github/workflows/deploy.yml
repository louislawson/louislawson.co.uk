name: Deploy

on:
  # Pushes to main use a deny-list, which fails safe: anything not explicitly excluded still builds
  # and deploys production, so a build input added later can never leave production on an old
  # build. Only what cannot change the built site is excluded (docs, infrastructure, tooling
  # folders, the scripts, the e2e tests, code only the scripts and tests use, tests, the test,
  # lint and format configs, editor and ignore files, the licence, Markdown outside src/, and the
  # workflows other than this one and the local actions; .gitattributes is deliberately not
  # excluded, since it controls line endings in the checkout), because each production deploy
  # fetches the deployment token and runs Microsoft's client. The code only the scripts and
  # tests use is src/metadata/ (the metadata check), src/content/list-placeholders.ts (the
  # placeholder listing) and src/e2e/ (the e2e server's rules); nothing the build reads imports
  # any of them, which src/deploy-path-filters.test.ts checks. Negations need a positive pattern first, and a later pattern overrides an earlier one.
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!infra/**"
      - "!scripts/**"
      - "!e2e/**"
      - "!.impeccable/**"
      - "!.claude/**"
      - "!src/**/*.test.*"
      - "!src/**/*.spec.*"
      - "!src/**/__tests__/**"
      - "!src/**/__fixtures__/**"
      - "!vitest.config.ts"
      - "!playwright.config.ts"
      - "!eslint.config.mjs"
      - "!.prettierrc.json"
      - "!.prettierignore"
      - "!.markdownlint-cli2.jsonc"
      - "!.editorconfig"
      - "!.gitignore"
      - "!LICENSE"
      - "!.github/**"
      - .github/workflows/deploy.yml
      - .github/actions/**
      - "!**/*.md"
      - src/**/*.md
      # Last, so that the Markdown re-include above cannot win over them.
      - "!src/metadata/**"
      - "!src/content/list-placeholders.ts"
      - "!src/e2e/**"
  # Pull requests use an allow-list instead, because there a wrong guess only costs a preview, not
  # a production deploy. They get a preview only for changes the build reads: the source
  # (Markdown under src/ is content; tests, specs and fixtures are not, and neither are
  # src/metadata/, src/content/list-placeholders.ts and src/e2e/, which only the scripts and
  # tests use), static files, and the files the build or install reads. Tests, lint and format configs, docs,
  # infrastructure and tooling folders are not on it, so they would only produce a preview
  # identical to production and use up one of the Free plan's 3 slots. Such pull requests still
  # build and test in CI.
  # A draft pull request builds in CI but gets no preview until it is marked ready for review.
  # Removing a preview (on close, or when a pull request goes back to draft) is a separate
  # workflow, preview-cleanup.yml, because this paths filter is evaluated on the final diff and
  # would miss a pull request that was reduced to a docs-only diff after it had deployed one.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - src/**
      - "!src/**/*.test.*"
      - "!src/**/*.spec.*"
      - "!src/**/__tests__/**"
      - "!src/**/__fixtures__/**"
      - "!src/metadata/**"
      - "!src/content/list-placeholders.ts"
      - "!src/e2e/**"
      - public/**
      - astro.config.mjs
      - package.json
      - package-lock.json
      - .npmrc
      - .nvmrc
      - tsconfig.json
      - .github/workflows/deploy.yml
      - .github/actions/**
  # Production is rebuilt every day, so a statement that expires on a date (the availability line)
  # disappears without a push. A scheduled run is always on the default branch, so it is a
  # production run: it builds with DEPLOY_CONTEXT=production, joins the production queue below, and
  # always deploys (redeploying identical output is harmless). The plan identity already trusts
  # ref:refs/heads/main, whatever the event. Microsoft's client does not read the event name: it
  # treats an event with no pull_request as a deploy of the branch the event names (or the
  # repository's default branch, which a schedule event carries), and that branch is
  # INPUT_PRODUCTION_BRANCH, so the deploy is production, never a preview. That was read from the
  # pinned client's own code, not yet seen in a live scheduled run: the first run after the merge
  # is the proof. The odd minute avoids GitHub's busiest moment at the top of the hour. 04:17 UTC
  # is 04:17 GMT or 05:17 BST, so a statement that expires at the end of a UK day stays up for a
  # few hours past midnight. GitHub switches schedules off in a public repository after 60 days
  # without activity; the runbook says how to spot and re-enable that.
  schedule:
    - cron: "17 4 * * *"

permissions: {}

# Two levels of concurrency, for two different jobs:
#
# 1. This workflow-level group queues whole RUNS for the same target in the order they were
#    pushed: one group for production (pushes and the daily schedule alike), one per pull request.
#    The group is named for production unless the run is a pull request, so any other trigger
#    added later is queued with production rather than in a group with an empty number. The
#    deploy job below waits for its build, and builds finish in whatever order they take, so a
#    group on the deploy job alone would deploy in build-finish order, and a slow older build
#    could overwrite a newer deploy while every run stays green. GitHub keeps one running and
#    one pending run per group, so a newer pending run replaces an older pending one, which is
#    right: the newer build contains the older commit. Nothing running is ever cancelled. Do not
#    add a "skip unless head of main" guard instead: a later push that the paths filter ignores
#    moves main without a deploy.
# 2. The group on the deploy job, further down, exists so preview-cleanup.yml can use the same
#    name and a close never overlaps a deploy of the same pull request. It is a different name
#    from this one, so a run can never wait on itself.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('Deploy-runs-{0}', github.event.pull_request.number) || 'Deploy-production-runs' }}
  cancel-in-progress: false

env:
  # Not secrets: both names are committed in infra/site.
  SWA_NAME: stapp-louislawson-web-prod-weu
  SWA_RESOURCE_GROUP: rg-louislawson-web-prod-weu

jobs:
  build:
    # Not just "Build": the CI workflow has a required check with that name.
    name: Deploy build
    # Previews are skipped for Dependabot pull requests and for forks (neither can reach the
    # plan identity), and the free plan allows only 3 preview environments at once. The test is
    # on the pull request's author, not the actor: the actor is whoever pushed last, so it would
    # change when Louis pushes a commit to a Dependabot branch.
    if: >-
      github.event_name == 'push'
      || github.event_name == 'schedule'
      || (github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login != 'dependabot[bot]'
        && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # SITE_URL is plain configuration: set the SITE_URL repository variable when the
          # domain is connected. Unset, the site falls back to its default in src/config/site.ts.
          SITE_URL: ${{ vars.SITE_URL }}
          # Preview builds always send noindex: preview URLs are public.
          DEPLOY_CONTEXT: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          # BUILD_NUMBER and GIT_SHA are for the trace panel, which shows them (src/config/
          # build-info.ts reads both, and shows neither unless both are valid). On a pull request
          # GITHUB_SHA is the temporary merge commit, so use the head commit that the preview
          # comment names.
          BUILD_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          GIT_SHA="${HEAD_SHA::7}" npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          if-no-files-found: error
          include-hidden-files: true # e.g. public/.well-known/ would otherwise be dropped
          # A scheduled run rebuilds the same code every day, so its artifact is kept for a day.
          retention-days: ${{ github.event_name == 'schedule' && 1 || 7 }}

  deploy:
    name: Deploy
    needs: build
    # Shared with preview-cleanup.yml, which uses the same name for the same pull request, so a
    # close never overlaps a deploy. It is on this job, not the workflow, so a run whose jobs are
    # all skipped (a draft) never enters it and cannot displace a pending close. Run ordering is
    # the workflow-level group at the top of this file; this one is a different name on purpose.
    # The group alone does not stop a run that was already building when its pull request was
    # closed or converted to draft: cleanup would take the group first, find nothing, and the
    # deploy would then upload a preview nobody removes. So the first step, which runs inside the
    # group, checks that the pull request is still open and ready, and every later step is skipped
    # if not.
    concurrency:
      group: Deploy-${{ github.event.pull_request.number || 'production' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `environment:` here: that would change the OIDC subject, and the plan identity is
    # trusted only for pull_request and ref:refs/heads/main. No `npm install` either: this job
    # holds the identity, so it downloads the build artifact and runs nothing from the project.
    permissions:
      contents: read # sparse checkout of the local actions only
      id-token: write
      pull-requests: read # the guard step reads the pull request's state
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check the pull request is still open and ready
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "proceed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          state="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '"\(.state) draft=\(.draft)"')"
          if [ "${state}" = "open draft=false" ]; then
            echo "proceed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            echo "Pull request ${PR_NUMBER} is now \"${state}\", so no preview is deployed."
          fi
      # A local action needs the repository, but only the actions folder: this job holds the
      # identity, so it checks out nothing else. `$/` would avoid the checkout, but actionlint
      # 1.7.12 rejects it; switch when a release accepts it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.proceed == 'true'
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false # cone mode would also check out every root-level file
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.guard.outputs.proceed == 'true'
        with:
          name: site
          path: dist
      # Masks and validates the IDs, signs in and fetches the token. The IDs reach only that
      # action's own steps, so the deployment client below never receives them.
      - name: Sign in and fetch the deployment token
        id: swa
        if: steps.guard.outputs.proceed == 'true'
        uses: ./.github/actions/swa-deployment-token # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the `$/` syntax
        with:
          client-id: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          name: ${{ env.SWA_NAME }}
          resource-group: ${{ env.SWA_RESOURCE_GROUP }}
      # Microsoft's Static Web Apps client, from a digest-pinned image, given only the token and
      # its settings: not this job's environment, its OIDC request token or the Docker socket.
      - name: Upload to Static Web Apps
        id: deploy
        if: steps.guard.outputs.proceed == 'true'
        uses: ./.github/actions/swa-client # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the `$/` syntax
        with:
          token: ${{ steps.swa.outputs.token }}
          action: upload

  comment:
    name: Preview comment
    needs: deploy
    # No URL means the guard skipped the upload, so there is nothing to announce.
    if: github.event_name == 'pull_request' && needs.deploy.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # edits the sticky preview comment; no checkout, no Azure access
    steps:
      - name: Post the preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ needs.deploy.outputs.url }}
        run: |
          marker='<!-- deploy-preview -->'
          {
            echo "${marker}"
            echo "### Preview"
            echo
            echo "${PREVIEW_URL} (built from ${HEAD_SHA:0:7})"
            echo
            echo "Public, marked noindex, and removed when this pull request closes or goes back to draft."
          } > comment.md
          id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- deploy-preview -->"))) | .id' | head -n 1)"
          if [ -n "${id}" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${id}" --field body=@comment.md > /dev/null
          else
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file comment.md
          fi
