name: Infrastructure

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/infra.yml
  # Only changes that can alter the site stack's plan trigger a push run, and so a production
  # approval: not the workflow itself (validated on its pull request), bootstrap, Markdown or tests.
  push:
    branches: [main]
    paths:
      - infra/site/**
      - "!infra/site/**/*.md"
      - "!infra/site/tests/**"
  # Checks and plan only, never apply. Run it from main, where the plan identity is trusted.
  workflow_dispatch:

permissions: {}

# In-flight runs are never cancelled: a plan or apply killed mid-run can leave the state blob
# lease held, which blocks every later run until someone breaks it by hand. GitHub keeps one
# running and one pending run per group, so a newer pending run replaces an older pending one
# (it never started, so nothing is interrupted). This group is also what serialises applies on
# main: a second push waits for the first run, apply included, to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.16.2 # Not tracked by Dependabot: bump by hand.
  TFLINT_VERSION: v0.64.0 # Not tracked by Dependabot: bump by hand.

jobs:
  checks:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      # Trivy runs before any `terraform init`, so it scans only committed files.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (0.35.0 or later: earlier tags were compromised, CVE-2026-33634)
        with:
          scan-type: config
          scan-ref: infra
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
      - name: Format
        run: terraform fmt -check -recursive -diff infra
      - name: Validate and lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # tflint --init downloads the azurerm ruleset
        run: |
          tflint --config="${GITHUB_WORKSPACE}/infra/.tflint.hcl" --chdir=infra/site --init
          for dir in infra/bootstrap infra/site; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -backend=false -lockfile=readonly -input=false
            terraform -chdir="${dir}" validate
            tflint --config="${GITHUB_WORKSPACE}/infra/.tflint.hcl" --chdir="${dir}"
            echo "::endgroup::"
          done
      - name: terraform test
        run: terraform -chdir=infra/site test
      # terraform test cannot observe lifecycle rules, so guard the two that matter here: the
      # repository_* fields Azure records on API-key deploys, and deletion protection.
      - name: Static Web App lifecycle guard
        run: |
          # Only the Static Web App resource block, with comment lines removed and whitespace stripped.
          block="$(awk '/^resource "azurerm_static_web_app" "site" \{/ {on=1} on {print} on && /^\}/ {exit}' infra/site/main.tf \
            | grep -Ev '^[[:space:]]*#' | sed -E 's/#.*$//' | tr -d '[:space:]')"
          if [ -z "${block}" ]; then
            echo "::error::azurerm_static_web_app.site not found in infra/site/main.tf"
            exit 1
          fi
          failed=0
          for field in repository_branch repository_url; do
            if ! grep -Eq "ignore_changes=\[[^]]*${field}[^]]*\]" <<< "${block}"; then
              echo "::error::${field} is not in the Static Web App's ignore_changes"
              failed=1
            fi
          done
          if ! grep -Eq 'prevent_destroy=true' <<< "${block}"; then
            echo "::error::the Static Web App is missing prevent_destroy = true"
            failed=1
          fi
          exit "${failed}"

  plan:
    name: Terraform plan
    needs: checks
    # Pushes to main plan too, so the plan is on screen while the production approval is pending.
    # Fork pull requests get no OIDC token and no access to the plan identity, and a dispatch
    # from any other ref would present a subject the plan identity does not trust.
    #
    # Dependabot's own run skips this job, so Louis reads a provider bump (changelog, publisher,
    # release date) before it can reach the plan identity, which can read the deployment token.
    # Re-running the workflow makes him the triggering actor and the plan then runs. A re-run
    # keeps the original run's privileges, so it still uses Dependabot's secrets and token.
    if: >-
      github.triggering_actor != 'dependabot[bot]'
      && (
        github.event_name == 'push'
        || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `environment:` here: that would change the OIDC subject, and the plan identity is
    # trusted only for pull_request and ref:refs/heads/main (what this job runs on).
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      ARM_USE_OIDC: "true"
      # Secrets only: the runner masks a secret from the first log line, but a variable would be
      # printed in the env header of the step that masks it. Dependabot-triggered runs read the
      # same-named Dependabot secrets.
      ARM_CLIENT_ID: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      # The apply job reuses this step through the YAML anchor.
      - &mask_azure_ids
        name: Check and mask Azure IDs
        run: |
          # Mask every value first, so one that fails the check below is still masked. Never echo
          # a value: report only which one is wrong.
          failed=0
          for name in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
            if [ -n "${!name}" ]; then
              echo "::add-mask::${!name}"
            fi
          done
          for name in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is empty: the matching Actions secret (Dependabot secret for Dependabot runs) is not set"
              failed=1
            elif ! [[ "${!name}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
              echo "::error::${name} is not a GUID (check the secret for whitespace)"
              failed=1
            fi
          done
          exit "${failed}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Init
        run: terraform -chdir=infra/site init -lockfile=readonly -input=false
      - name: Plan
        run: terraform -chdir=infra/site plan -input=false -lock-timeout=10m -out=tfplan
      - name: Render plan
        # Explicit bash enables pipefail, so a failed `terraform show` cannot publish an empty plan.
        shell: bash
        run: |
          fence="$(printf '\140\140\140')"
          {
            echo '<!-- terraform-plan:site -->'
            echo '### Terraform plan: infra/site'
            echo
            echo "${fence}text"
            # The repository is public: never publish GUIDs (subscription, tenant, principal IDs).
            terraform -chdir=infra/site show -no-color tfplan \
              | sed -E 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<guid>/g' > plan-body.txt
            head -c 60000 plan-body.txt
            echo
            echo "${fence}"
            if [ "$(wc -c < plan-body.txt)" -gt 60000 ]; then
              echo
              echo '_The plan was truncated at 60000 bytes; see the job log for the rest._'
            fi
          } > plan-comment.tmp
          cat plan-comment.tmp >> "${GITHUB_STEP_SUMMARY}"
          # Last, so plan-comment.md exists only if every command above succeeded; the comment
          # step posts a failure notice when it is missing, never a partial plan.
          mv plan-comment.tmp plan-comment.md
      # A Dependabot pull request's token is read-only, and a re-run by Louis keeps it, so
      # `github.actor` (the original actor, unlike `triggering_actor`) is the right test here.
      # Such runs get the step summary only.
      # Runs even when the plan failed (but not when cancelled), so a comment from an earlier push
      # is replaced by a notice instead of still showing a plan for code that no longer plans.
      - name: Post plan comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f plan-comment.md ]; then
            {
              echo '<!-- terraform-plan:site -->'
              echo '### Terraform plan: infra/site'
              echo
              echo "The plan for ${HEAD_SHA:0:7} failed or did not run, so any plan shown earlier is out of date. See the run: ${RUN_URL}"
            } > plan-comment.md
          fi
          id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- terraform-plan:site -->"))) | .id' | head -n 1)"
          if [ -n "${id}" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${id}" --field body=@plan-comment.md > /dev/null
          else
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file plan-comment.md
          fi

  apply:
    name: Terraform apply
    needs: [checks, plan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Louis approves the production environment before this job starts. The apply identity is
    # trusted only for that environment's OIDC subject.
    environment: production
    # No job-level concurrency group: the workflow-level one already serialises runs on main.
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - *mask_azure_ids
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the guard below compares this commit with origin/main
      # A re-run, or a stale run left waiting for approval, would otherwise apply an older commit
      # and revert infrastructure to it. Refuse only when a later commit on main changed the site
      # stack in a way that triggers a run of its own (the same paths as the push trigger), since
      # that run applies the newer state. A later docs-only merge, which starts no run, must not
      # strand this one. Keep these pathspecs in step with `on.push.paths`.
      - name: Refuse a commit superseded by a later infrastructure change
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          later="$(git log --format=%H "${RUN_SHA}..origin/main" -- \
            ':(glob)infra/site/**' ':(exclude,glob)infra/site/**/*.md' ':(exclude,glob)infra/site/tests/**')"
          if [ -n "${later}" ]; then
            newest="$(head -n 1 <<< "${later}")"
            echo "::error::This run is for ${RUN_SHA:0:7}, but ${newest:0:7} on main changed infra/site after it. Cancel this run and approve the one for ${newest:0:7}"
            exit 1
          fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Init
        run: terraform -chdir=infra/site init -lockfile=readonly -input=false
      - name: Plan
        run: terraform -chdir=infra/site plan -input=false -lock-timeout=10m -out=tfplan
      # If the first apply hangs after the Static Web App is created (a reported provider issue),
      # re-run with -parallelism=1. Do not set TF_LOG here: this log is public, and debug output
      # includes full response bodies, among them the listSecrets response that carries the
      # deployment token, which add-mask does not cover. To see more, reproduce locally, or set
      # TF_LOG_PATH to a file that is never uploaded.
      - name: Apply
        run: terraform -chdir=infra/site apply -input=false -lock-timeout=10m tfplan
